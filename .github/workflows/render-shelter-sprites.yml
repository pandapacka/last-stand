name: Render shelter PNG sprites
on:
  push:
    paths:
      - 'assets/shelter/*.svg'
      - '.github/workflows/render-shelter-sprites.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render transparent 512px PNG assets
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          for src in Path('assets/shelter').glob('*.svg'):
              cairosvg.svg2png(url=str(src),write_to=str(src.with_suffix('.png')),output_width=512,output_height=512)
          PY
      - name: Commit rendered PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/shelter/*.png
          git diff --cached --quiet || (git commit -m "Render shelter sprites to PNG" && git push)
