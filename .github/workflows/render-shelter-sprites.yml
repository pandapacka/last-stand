name: Render detailed PNG shelter assets
on:
  push:
    paths:
      - 'tools/render_hq.py'
      - '.github/workflows/render-shelter-sprites.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render native raster HQ
        run: |
          python -m pip install --quiet pillow
          python tools/render_hq.py
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/shelter/hq.png
          git diff --cached --quiet || (git commit -m "Update detailed HQ PNG" && git push)
